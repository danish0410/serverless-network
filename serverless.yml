frameworkVersion: "~3.40.0"

service: rajasekar-serverless

custom:
  config: ${file(./config.yml)}
  appName: ${self:custom.config.app.name}
  regionConfig: ${self:custom.config.regions.${self:provider.region}, self:custom.config.regions.default}
  keyName: key-${self:provider.region}

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'ap-south-2'}
  stage: ${opt:stage, 'prod'}

  # ✅ HTTP API
  httpApi:
    cors: true
    authorizers:
      cognitoAuth:
        identitySource: $request.header.Authorization
        issuerUrl:
          Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}
        audience:
          - !Ref CognitoUserPoolClient

  environment:
    TABLE_NAME: ${self:custom.appName}-table-${self:provider.region}
    BUCKET_NAME: ${self:custom.appName}-bucket-${self:provider.region}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
          Resource:
            Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:custom.appName}-table-${self:provider.region}

        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            Fn::Sub: arn:aws:s3:::${self:custom.appName}-${self:provider.stage}-${AWS::AccountId}-${AWS::Region}/*

  vpc:
    securityGroupIds:
      - !Ref LambdaSecurityGroup
    subnetIds:
      - !Ref PrivateSubnet1

functions:
  hello:
    # handler: handler.hello
    handler: dist/handler.hello
    timeout: 10
    events:
      - httpApi:
          path: /hello
          method: GET
          authorizer:
            name: cognitoAuth

resources:
  Resources:

    # ---------------- COGNITO ----------------
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:custom.appName}-user-pool
        AutoVerifiedAttributes:
          - email

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:custom.appName}-client
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false

    # ---------------- VPC ----------------
    MyVPC:
      Type: AWS::EC2::VPC
      Properties:
        CidrBlock: ${self:custom.regionConfig.cidr}

    PublicSubnet:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref MyVPC
        CidrBlock: ${self:custom.regionConfig.publicSubnet}
        MapPublicIpOnLaunch: true
        AvailabilityZone:
          Fn::Select:
            - 0
            - Fn::GetAZs: ""

    PrivateSubnet1:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref MyVPC
        CidrBlock: ${self:custom.regionConfig.privateSubnet}
        AvailabilityZone:
          Fn::Select:
            - 0
            - Fn::GetAZs: ""

    # ---------------- SECURITY GROUPS ----------------
    BastionSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Bastion SG
        VpcId: !Ref MyVPC
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: ${param:cidrIp, "0.0.0.0/0"}

    LambdaSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Lambda SG
        VpcId: !Ref MyVPC

    # ---------------- EC2 ----------------
    BastionHost:
      Type: AWS::EC2::Instance
      Properties:
        InstanceType: ${self:custom.regionConfig.instanceType}
        SubnetId: !Ref PublicSubnet
        SecurityGroupIds:
          - !Ref BastionSecurityGroup
        ImageId:
          Fn::Sub: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}"
        KeyName: ${self:custom.keyName}

    # ---------------- S3 ----------------
    MyS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName:
          Fn::Sub: ${self:custom.appName}-${self:provider.stage}-${AWS::AccountId}-${AWS::Region}

    # ---------------- DynamoDB ----------------
    MyDynamoTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.appName}-${self:provider.region}-table
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    # ---------------- CLOUDFRONT (NO DOMAIN) ----------------
    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true

          Origins:
            - Id: ApiOrigin
              DomainName:
                Fn::Sub: ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
              CustomOriginConfig:
                OriginProtocolPolicy: https-only

          DefaultCacheBehavior:
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization

          # ✅ Default CloudFront SSL (NO ACM needed)
          ViewerCertificate:
            CloudFrontDefaultCertificate: true

  Outputs:
    CloudFrontURL:
      Value: !GetAtt CloudFrontDistribution.DomainName

    ApiGatewayURL:
      Value:
        Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com

    CognitoUserPoolId:
      Value: !Ref CognitoUserPool

    CognitoClientId:
      Value: !Ref CognitoUserPoolClient